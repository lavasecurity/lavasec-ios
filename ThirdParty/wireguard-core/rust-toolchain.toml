# Pin Rust and targets for source builds. Xcode/SDK versions are detected on the
# active host and recorded as provenance, without a historical compiler pin.
[toolchain]
channel = "1.94.0"
# aarch64-apple-darwin is deliberate: the macOS slice is what lets executable
# package tests drive the real Noise state machine under `swift test` (plan D4).
targets = ["aarch64-apple-ios", "aarch64-apple-ios-sim", "aarch64-apple-darwin"]
