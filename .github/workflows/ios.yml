name: iOS CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

# NB: intentionally NO event-level `paths-ignore` (REL-6). A docs filter means a docs-only PR never
# TRIGGERS this workflow, so its required contexts (Repo Checks, Swift Package Tests,
# iOS Simulator Build) are never reported and the PR is stuck on "Expected — waiting for
# status" with only an admin override to escape — hostile to the outside doc contributors
# CONTRIBUTING.md invites, and normalizing the override habit. Instead the workflow always
# runs; the `changes` job flags a docs-only diff so the expensive macOS jobs short-circuit
# their work (still completing green) while the contexts always report.
# Pushes use the same complete local diff, avoiding event-level path-filter limits.

concurrency:
  # A docs-only push must not cancel a running or queued source build.
  # PR updates still replace obsolete checks of the same complete PR diff.
  group: ios-ci-${{ github.event_name == 'push' && github.run_id || github.ref }}
  cancel-in-progress: true

# Linux jobs use ephemeral Ubicloud runners; Xcode jobs use owned Macs.
# Runner labels are fixed: no GitHub-hosted fallback or variable override.

jobs:
  changes:
    # Flags docs-only PRs and pushes so the expensive macOS jobs can short-circuit while still
    # completing (their required contexts must report — see the no-paths-ignore note
    # above). Cheap Linux; the mac jobs `needs:` it. Manual/unknown events and
    # anything that can't be classified fall through to docs_only=false → jobs run fully.
    name: Detect docs-only diff
    # Linux jobs use ephemeral Ubicloud runners; Xcode jobs use owned Macs.
    # Runner labels are fixed: no GitHub-hosted fallback or variable override.
    runs-on: ubicloud-standard-2
    timeout-minutes: 5
    outputs:
      docs_only: ${{ steps.detect.outputs.docs_only }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0   # need base..head to diff the PR's file list
      - name: Detect docs-only diff
        id: detect
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event_name == 'push' && github.event.before || github.event.pull_request.base.sha }}
          HEAD: ${{ github.event_name == 'push' && github.sha || github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          docs_only="$(ci/detect-docs-only.sh \
            --event "$EVENT" \
            --base "$BASE" \
            --head "$HEAD")"
          case "$docs_only" in
            true|false) ;;
            *) echo "::error::invalid docs-only result; running fully"; docs_only=false ;;
          esac
          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"
          [ "$docs_only" = true ] && echo "docs-only → macOS jobs short-circuit" || echo "full CI required"

  repo-checks:
    name: Repo Checks
    # Linux jobs use ephemeral Ubicloud runners; Xcode jobs use owned Macs.
    # Runner labels are fixed: no GitHub-hosted fallback or variable override.
    runs-on: ubicloud-standard-2
    timeout-minutes: 10
    steps:
      - name: Require trusted branch for native validation
        if: ${{ github.event_name == 'pull_request' && (github.event.pull_request.head.repo.full_name != github.repository || github.event.pull_request.user.login == 'dependabot[bot]') }}
        run: |
          echo "::error::Native validation requires a reviewed branch in this repository. Fork and unreviewed dependency-bot code cannot run on persistent Macs, and GitHub-hosted runners are disabled."
          exit 1
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0   # need the base..head range for the merge-up contamination guard

      - name: Check GPL blocklist distribution guardrails
        run: scripts/check-gpl-blocklist-distribution.sh

      - name: Check blocklist catalog codegen is in sync with the canonical spec
        run: node scripts/generate-blocklist-catalog.mjs --check

      - name: Check localization completeness (all locales present + nothing left untranslated)
        run: node scripts/check-localization.mjs

      - name: Check UI string catalog coverage (no hardcoded user-facing strings outside the catalog)
        run: node scripts/check-string-coverage.mjs

      - name: Test repository guardrail fixtures
        run: node --test scripts/tests/*.test.mjs

      - name: Check XcodeGen source membership
        run: node scripts/check-xcodegen-sources.mjs

      - name: Check invariant and comment contracts
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "pull_request" ]; then
            node scripts/check-comment-contracts.mjs --base "$BASE" --head "$HEAD"
          else
            node scripts/check-comment-contracts.mjs
          fi

      - name: Check missing-doc baseline does not grow
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BASE: ${{ github.event.before }}
          PUSH_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          case "$EVENT" in
            pull_request)
              base="$PR_BASE"
              head="$PR_HEAD"
              ;;
            push)
              base="$PUSH_BASE"
              head="$PUSH_HEAD"
              ;;
            *)
              node scripts/check-missing-docs-baseline.mjs
              exit 0
              ;;
          esac
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            echo "::error::missing usable base revision for missing-doc ratchet"
            exit 1
          fi
          if [ -z "$head" ]; then
            echo "::error::missing head revision for missing-doc ratchet"
            exit 1
          fi
          node scripts/check-missing-docs-baseline.mjs --base "$base" --head "$head"

      - name: SwiftLint (warning-only)
        # Phase C2 lint lane (lavasec-infra plans/2026-07-07-ios-modularization-scaffolding-plan.md).
        # --lenient downgrades every violation to a warning, so findings ANNOTATE the PR but
        # never fail this required check; a broken .swiftlint.yml still fails loudly.
        # missing_docs is scoped to the post-split SPM targets via their nested configs.
        # Version-pinned like the other containerized scanners (security.yml).
        # Digest-pinned (OCR P3 on lavasec-ios#50): a version tag is mutable — a
        # compromised registry account could re-push it; the digest is the container
        # equivalent of SHA-pinning an action. Tag kept for human readability.
        uses: docker://ghcr.io/realm/swiftlint:0.59.1@sha256:4002261af030eebefc377b8b5e429a3b553023d6b91cd6ea0d874d4cdaa1eaf8
        with:
          # The leading `swiftlint` token is REQUIRED for this pinned image: 0.59.1 is
          # CMD-style (no ENTRYPOINT), so args form the whole container command — dropping
          # the token fails at docker exec (`"--lenient": executable file not found`,
          # run 2026-07-08 on this repo). Upstream added an ENTRYPOINT after 0.59.1
          # (Codex P1 on lavasec-ios#50 cited main); if this pin is ever bumped to an
          # ENTRYPOINT image, drop the token or the binary name doubles.
          args: swiftlint --lenient --reporter github-actions-logging

      - name: SwiftLint missing-doc regressions (blocking)
        uses: docker://ghcr.io/realm/swiftlint:0.59.1@sha256:4002261af030eebefc377b8b5e429a3b553023d6b91cd6ea0d874d4cdaa1eaf8
        with:
          # Dedicated ratchet: the general invocation above remains warning-only;
          # this fails only for missing-doc findings absent from the committed baseline.
          args: swiftlint lint --config .swiftlint-missing-docs.yml --strict --only-rule missing_docs --baseline .swiftlint-missing-docs-baseline.json --reporter github-actions-logging

      - name: Merge-up contamination guard
        if: ${{ github.event_name == 'pull_request' }}
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          HEAD_REF: ${{ github.head_ref }}
          IS_FORK: ${{ github.event.pull_request.head.repo.fork }}
        run: |
          set -euo pipefail
          # This repo's history was scrubbed to a single canonical identity, and changes from
          # the PRIVATE internal dev repo are promoted here via content-only PRs. This guard
          # blocks the ways internal mess could leak into the public AGPL history.
          range="${BASE}..${HEAD}"
          fail=0

          # Cover BOTH transient and persistent forbidden files: UNION the per-commit file
          # lists (git log --name-only — catches files added then deleted within the range)
          # with the net endpoint diff (git diff — catches the final tree, INCLUDING files
          # introduced only by a merge commit's resolution, which git log omits by default). (Codex P1)

          # (a) gitignored-local config / QA-only paths must never appear in any commit OR the net tree.
          touched=$(
            { git log "$range" --name-only --pretty=format:; git diff --name-only "$range"; } \
              | sort -u | grep -v '^$' || true
          )
          if printf '%s\n' "$touched" | grep -E '\.local\.xcconfig$|(^|/)QA/'; then
            echo "::error::a commit in this PR touches a *.local.xcconfig or QA/ path that must never be public."; fail=1
          fi

          # (b) The internal-only build flag must never be ENABLED by a new build setting or
          #     command line. Source condition references and test strings are legitimate.
          if ! node scripts/check-public-qa-enablement.mjs --base "$BASE" --head "$HEAD"; then
            echo "::error::a commit in this PR enables the internal-only LAVA_QA_TOOLS flag in tracked source."; fail=1
          fi

          # (c) Identity: STRICT on promote/* (internal->public). Allow ONLY the canonical
          #     lavasecurity account (+ GitHub's web-merge committer) — NOT the whole noreply
          #     domain, so a different contributor's private email can't publish into the
          #     scrubbed history. (Codex P1) Soft on outside forks (path/flag guards still apply).
          if [ "${IS_FORK}" != "true" ] && printf '%s' "${HEAD_REF}" | grep -q '^promote/'; then
            canonical='^(285110054\+lavasecurity@users\.noreply\.github\.com|noreply@github\.com)$'
            bad=$(git log "$range" --format='%ae%n%ce' | sort -u | grep -vE "$canonical" || true)
            if [ -n "$bad" ]; then
              echo "::error::promotion PR carries non-canonical author/committer identity (expected only the lavasecurity account):"
              printf '%s\n' "$bad" | sed 's/^/  /'
              fail=1
            fi
          fi

          if [ "$fail" = 0 ]; then echo "contamination guard: clean"; else exit 1; fi

  swift-package-tests:
    name: Swift Package Tests
    needs: changes
    # Xcode jobs use owned Macs only. Fork code must never run on persistent hosts.
    # `!cancelled()` forces this REQUIRED job to run even if the `changes` prerequisite FAILED
    # (transient checkout/git-diff/outage) instead of being skipped by `needs` — a skipped-after-
    # failed-dependency required check may not block the PR, so a code PR could merge without this
    # macOS check (Codex P1 #232). On a `changes` failure `docs_only` is '' so the step-level guard
    # runs the suite fully (fail-safe).
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]')) }}
    runs-on: [self-hosted, macOS]
    # 30, not this lane's natural ~5: VM jobs hold only the SHARED maintenance lock, so a
    # co-scheduled production release archive core-starves this REQUIRED lane instead of
    # queueing it (same failure shape that cancelled PR #347's compile at its timeout —
    # run 29174328997). Headroom makes rare co-scheduling slow-but-green, not a false red.
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Show Xcode Version
        run: xcodebuild -version

      - name: Prepare warm test cache (per-runner, Xcode-keyed)
        # Docs-only PRs skip the mac test entirely (REL-6); the job still completes so its
        # required "Swift Package Tests" context reports green.
        if: ${{ needs.changes.outputs.docs_only != 'true' }}
        run: |
          set -euo pipefail
          # Warm per-runner cache keyed by the Xcode build version. On GitHub-hosted runners the home
          # dir is ephemeral so this is just a cold run (harmless); on a persistent self-hosted runner
          # it makes incremental test builds fast. Growth is bounded by the runner maintenance sweep.
          XC="$(xcodebuild -version 2>/dev/null | awk '/^Build version/{print $3}')"; XC="${XC:-unknown}"
          CACHE="$HOME/.lava-ci/cache/${RUNNER_NAME:-shared}/xcode-$XC"
          mkdir -p "$CACHE/.build" "$CACHE/spm"
          { echo "SCRATCH=$CACHE/.build"; echo "SPMCACHE=$CACHE/spm"; } >> "$GITHUB_ENV"
          echo "warm cache: $CACHE"

      - name: Check Swift package boundary before build
        if: ${{ needs.changes.outputs.docs_only != 'true' }}
        run: python3 scripts/check-swift-package-boundary.py

      - name: Test LavaSecCore
        if: ${{ needs.changes.outputs.docs_only != 'true' }}
        run: |
          set -euo pipefail
          # Warm per-runner cache ($SCRATCH/$SPMCACHE from the "Prepare warm test cache" step). The
          # shared lock helper lets the maintenance sweep GC that cache safely, never mid-build. On
          # GitHub-hosted runners RUNNER_ENVIRONMENT != "self-hosted", it executes directly.
          # The warning ratchet is intentionally unconditional. A hosted Xcode update can surface
          # warnings without a source change; fix forward, or temporarily pin Xcode byte-identically
          # in both repositories rather than weakening either CI lane.
          cmd=(swift test --package-path .
            -Xswiftc -warnings-as-errors
            --scratch-path "$SCRATCH"
            --cache-path "$SPMCACHE")
          ci/run-with-maintenance-lock.sh -- "${cmd[@]}"

  ios-simulator-build:
    name: iOS Simulator Build
    needs: changes
    # Linux jobs use ephemeral Ubicloud runners; Xcode jobs use owned Macs.
    # Runner labels are fixed: no GitHub-hosted fallback or variable override.
    if: ${{ !cancelled() && github.repository == 'lavasecurity/lavasec-ios' && (github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]')) }}
    runs-on: [self-hosted, macOS]
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Show Xcode Version
        run: xcodebuild -version

      - name: Build LavaSec
        # Docs-only PRs skip the ~30-min compile (REL-6); the job still reports its
        # required "iOS Simulator Build" context green.
        if: ${{ needs.changes.outputs.docs_only != 'true' }}
        run: |
          ci/run-with-maintenance-lock.sh -- xcodebuild \
            -project LavaSec.xcodeproj \
            -scheme LavaSec \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build
