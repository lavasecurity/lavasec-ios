name: Code Review

# Delegates to the trusted org-wide OCR workflow using the direct DeepSeek API.
# Requires OCR_DEEPSEEK_AUTH_TOKEN, separate from the legacy Go credential.
on:
  pull_request:
    types: [opened, synchronize, reopened]
  issue_comment:
    types: [created]

jobs:
  code-review:
    permissions:
      contents: read
      pull-requests: write
    uses: lavasecurity/.github/.github/workflows/code-review.yml@main
    with:
      llm_url: https://api.deepseek.com
      llm_model: deepseek-flash
      use_anthropic: false
    secrets:
      llm_auth_token: ${{ secrets.OCR_DEEPSEEK_AUTH_TOKEN }}
