name: React Native UI

on:
  push:
    branches: [main]
  pull_request:
    # `labeled` is load-bearing: `full-build` is the on-demand switch for
    # `native-full-app` below. Without this event, adding the label after the latest
    # push would not re-trigger the workflow, so the switch would only work when the
    # label happened to predate the push (Codex P2 on PR #784).
    #
    # `ready_for_review` is load-bearing the same way: both jobs skip while
    # `github.event.pull_request.draft` is true, so without the type, flipping a
    # draft to ready would leave the skipped contexts stale with no new run.
    # `converted_to_draft` cancels in-flight work when a PR is flipped back
    # (the new run skips, and the shared concurrency group kills the old one).
    # `unlabeled` cancels a withdrawn `full-build` request the same way: the
    # label-free run skips the lane and the concurrency group kills the old one.
    types: [opened, synchronize, reopened, labeled, unlabeled, ready_for_review, converted_to_draft]
  workflow_dispatch:
    inputs:
      validation:
        description: 'Compile, full-app journeys, or full-app plus preview parity tour'
        type: choice
        options: [compile, full-app-journeys, parity-review]
        default: compile

permissions:
  contents: read

concurrency:
  # Preserve native-input pushes when a later JS/docs-only push skips native.
  group: react-native-ui-${{ github.event_name == 'push' && github.run_id || github.ref }}
  cancel-in-progress: true

jobs:
  lava-ui:
    name: Detect native validation inputs
    # iOS CI owns the required Linux JS validation. This cheap classifier only
    # decides whether an explicitly requested native validation run is needed.
    if: ${{ github.repository == 'lavasecurity/lavasec-ios-internal' && github.event.pull_request.draft != true && (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-build')) }}
    # Keep the private runner fixed while public exports use hosted Linux.
    runs-on: ${{ (github.repository == 'lavasecurity/lavasec-ios-internal' && (github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]'))) && 'ubicloud-standard-2' || 'ubuntu-latest' }}
    timeout-minutes: 10
    outputs:
      docs_only: ${{ steps.changes.outputs.docs_only }}
      native_required: ${{ steps.native.outputs.required }}
    defaults:
      run:
        working-directory: ReactNative
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Detect docs-only diff
        id: changes
        working-directory: .
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event_name == 'push' && github.event.before || github.event.pull_request.base.sha }}
          HEAD: ${{ github.event_name == 'push' && github.sha || github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          docs_only="$(ci/detect-docs-only.sh --event "$EVENT" --base "$BASE" --head "$HEAD")"
          case "$docs_only" in true|false) ;; *) docs_only=false ;; esac
          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v7
        if: ${{ steps.changes.outputs.docs_only != 'true' }}
        with:
          node-version: '24'
      - name: Classify native build inputs
        id: native
        if: ${{ steps.changes.outputs.docs_only != 'true' }}
        working-directory: .
        env:
          FORCE_NATIVE: ${{ github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'full-build') }}
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event_name == 'push' && github.event.before || github.event.pull_request.base.sha }}
          HEAD: ${{ github.event_name == 'push' && github.sha || github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ "$FORCE_NATIVE" = true ]; then
            required=true
          else
            required="$(node ci/detect-rn-native-build.mjs --event "$EVENT" --base "$BASE" --head "$HEAD")"
          fi
          case "$required" in true|false) ;; *) required=true ;; esac
          echo "required=$required" >> "$GITHUB_OUTPUT"
          if [ "$required" = false ]; then
            echo 'Only RN JavaScript/tests or documentation changed; iOS CI runs the JS checks, native compilation is unnecessary.' >> "$GITHUB_STEP_SUMMARY"
          fi

  native-review-host:
    name: Optional preview parity tour
    # The migration fixture remains available explicitly. Its second cold RN
    # build and screenshots are not a routine PR gate. Keep simulator jobs serial.
    needs: native-full-app
    if: ${{ github.repository == 'lavasecurity/lavasec-ios-internal' && github.event_name == 'workflow_dispatch' && inputs.validation == 'parity-review' }}
    runs-on: [self-hosted, macOS]
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: ruby/setup-ruby@e81a8fa391b11a595c1b7ed84177cc0fe02faf83 # v1.328.0
        with:
          ruby-version: '3.3.12'
          bundler: '4.0.16'
          working-directory: ReactNative
      - name: Build and verify isolated native review host
        run: ci/run-with-maintenance-lock.sh -- bash ReactNative/scripts/build-review-host.sh
      - name: Upload review build and evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lava-ui-review-${{ github.sha }}
          path: ReactNative/.artifacts/review-host/
          if-no-files-found: warn
          retention-days: 7
      - name: Remove generated review dependencies
        if: ${{ always() }}
        run: rm -rf ReactNative/node_modules ReactNative/ios/Pods ReactNative/ios/build

  native-full-app:
    name: React Native full app and UIKit regressions
    needs: lava-ui
    # Owned private PRs only, matching light-build.yml. Public/fork CI still
    # verifies JS contracts and the closed review-project policy on Linux.
    # On push, dispatch and labelled PRs, only a complete, known JS-only diff skips
    # native work; unknown outputs after a prerequisite failure run fully, matching
    # the shared iOS fail-safe. Routine unlabelled PRs skip the lane outright — the
    # label gate below is the first filter, not the classifier — and a draft skips
    # even when labelled: `ready_for_review` is when a PR becomes real work.
    #
    # Unlabelled PRs skip this lane; main/full-build runs keep the independent
    # UIKit regressions without rebuilding the app already covered by Light Build.
    # Dispatch preserves standalone compilation and the full journey suite.
    # Identity predicate is `head.repo.full_name == github.repository`, NOT
    # `head.repo.fork == false`: the latter admits a cross-repository PR whose head
    # repo is not itself marked a fork, which would execute an outsider's tree on
    # the owned Mac (Kilo review of PR #780; ios.yml adopted the same predicate).
    if: ${{ !cancelled() && github.event.pull_request.draft != true && needs.lava-ui.outputs.docs_only != 'true' && needs.lava-ui.outputs.native_required != 'false' && github.repository == 'lavasecurity/lavasec-ios-internal' && (github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]' && contains(github.event.pull_request.labels.*.name, 'full-build'))) }}
    runs-on: [self-hosted, macOS]
    # The explicit journey lane covers the complete foreground/security UI suite
    # plus tablet passes. Cold compilation exceeded 50 minutes while sharing the
    # VM with the full build matrix on PR #933, so allow 90 minutes for compile.
    timeout-minutes: ${{ (inputs.validation == 'full-app-journeys' || inputs.validation == 'parity-review') && 210 || (github.event_name == 'workflow_dispatch' && 90 || 15) }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - if: ${{ github.event_name == 'workflow_dispatch' }}
        uses: ruby/setup-ruby@e81a8fa391b11a595c1b7ed84177cc0fe02faf83 # v1.328.0
        with:
          ruby-version: '3.3.12'
          bundler: '4.0.16'
          working-directory: ReactNative
      - name: Run requested native validation
        env:
          VALIDATION: ${{ inputs.validation || 'containment' }}
        run: |
          set -euo pipefail
          case "$VALIDATION" in
            containment) mode=--containment ;;
            compile) mode=--compile ;;
            full-app-journeys|parity-review) mode=--journeys ;;
            *) echo "Unexpected RN validation mode: $VALIDATION" >&2; exit 64 ;;
          esac
          ci/run-with-maintenance-lock.sh -- bash ReactNative/scripts/build-full-app.sh "$mode"
      - name: Summarize executed validation
        run: |
          cat ReactNative/.artifacts/full-app/validation.json >> "$GITHUB_STEP_SUMMARY"
          cat ReactNative/.artifacts/full-app/native-scaffold-results.json >> "$GITHUB_STEP_SUMMARY"
      - name: Upload full-app build and evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lava-rn-full-${{ github.sha }}
          path: ReactNative/.artifacts/full-app/
          if-no-files-found: warn
          retention-days: 7
      - name: Remove generated full-app dependencies
        if: ${{ always() }}
        run: rm -rf ReactNative/node_modules ReactNative/native-app/Pods ReactNative/native-app/build
